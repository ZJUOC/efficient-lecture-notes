<text x="188.0" y="184.0" font-size="12" fill="#c53030" text-anchor="end">0（支点）</text>
<text x="308.8" y="226.0" font-size="11" fill="#2b6cb0" text-anchor="start">1</text>
<text x="356.0" y="165.1" font-size="12" fill="#2b6cb0" text-anchor="start">|z − 1| = ½</text>
<text x="303.5" y="91.6" font-size="12" fill="#666" text-anchor="middle">圆盘 |z − 1| &lt; 1</text>
<text x="119.8" y="322.6" font-size="11" fill="#666" text-anchor="middle">|z| = 1：绕过支点</text>
<text x="25.3" y="223.0" font-size="12" fill="#c53030" text-anchor="start">割线</text>
<text x="470.0" y="100.0" font-size="13" fill="#333" text-anchor="start">圆盘 |z − 1| &lt; 1 不含支点 0，单连通：</text>
<text x="470.0" y="120.0" font-size="13" fill="#333" text-anchor="start">√z 在里面能取出单值解析的分支</text>
<text x="470.0" y="140.0" font-size="12" fill="#666" text-anchor="start">（题中 √1 = −1 那一支 = −主值）</text>
<text x="470.0" y="172.0" font-size="13" fill="#2b6cb0" text-anchor="start" font-weight="bold">蓝色曲线在圆盘内 ⇒ 柯西定理 ⇒ ∮ = 0</text>
<text x="470.0" y="214.0" font-size="13" fill="#333" text-anchor="start">对比：曲线绕过支点时，</text>
<text x="470.0" y="234.0" font-size="13" fill="#333" text-anchor="start">√z 走一圈变号，不再是单值解析函数，</text>
<text x="470.0" y="254.0" font-size="12" fill="#666" text-anchor="start">柯西定理不能用。例如主值沿 |z| = 1</text>
<text x="470.0" y="274.0" font-size="12" fill="#666" text-anchor="start">从割线下岸绕到上岸，积分为 −4i/3 ≠ 0</text>
<text x="400.0" y="26.0" font-size="15" fill="#333" text-anchor="middle">多值函数先选好分支，再看曲线是否绕过支点</text>
</svg>
