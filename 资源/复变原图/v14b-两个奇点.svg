<text x="163.7" y="172.9" font-size="13" fill="#c05621" text-anchor="end" font-style="italic">C₁</text>
<text x="296.3" y="172.9" font-size="13" fill="#2f855a" text-anchor="start" font-style="italic">C₂</text>
<text x="171.2" y="217.8" font-size="11" fill="#c05621" text-anchor="end">0</text>
<text x="288.8" y="217.8" font-size="11" fill="#2f855a" text-anchor="start">1</text>
<text x="272.8" y="96.5" font-size="14" fill="#2b6cb0" text-anchor="start" font-style="italic">C</text>
<text x="171.2" y="263.8" font-size="12" fill="#c05621" text-anchor="middle">−1/z 贡献 −2πi</text>
<text x="288.8" y="263.8" font-size="12" fill="#2f855a" text-anchor="middle">1/(z−1) 贡献 2πi</text>
<text x="470.0" y="96.0" font-size="14" fill="#333" text-anchor="start">1/(z² − z) = 1/(z − 1) − 1/z</text>
<text x="470.0" y="128.0" font-size="13" fill="#333" text-anchor="start">每一项只在自己的奇点处“发声”：</text>
<text x="470.0" y="148.0" font-size="12" fill="#666" text-anchor="start">围住 z₀ 的正向闭曲线上 ∮dz/(z−z₀) = 2πi</text>
<text x="470.0" y="186.0" font-size="13" fill="#2b6cb0" text-anchor="start" font-weight="bold">C 围住 0 与 1：(−2πi) + 2πi = 0</text>
<text x="470.0" y="210.0" font-size="13" fill="#c05621" text-anchor="start">只围住 0：−2πi</text>
<text x="470.0" y="232.0" font-size="13" fill="#2f855a" text-anchor="start">只围住 1：2πi</text>
<text x="470.0" y="270.0" font-size="12" fill="#666" text-anchor="start">积分为 0 不等于“里面没有奇点”，</text>
<text x="470.0" y="288.0" font-size="12" fill="#666" text-anchor="start">这里是两个奇点的贡献正好抵消</text>
<text x="400.0" y="26.0" font-size="15" fill="#333" text-anchor="middle">复合闭路：大曲线 C 上的积分 = 绕各奇点的小圆周上的积分之和</text>
</svg>
