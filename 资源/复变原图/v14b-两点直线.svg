<text x="421.5" y="157.4" font-size="14" fill="#2b6cb0" text-anchor="end" font-style="italic">z₂</text>
<text x="344.7" y="188.1" font-size="12" fill="#2b6cb0" text-anchor="end">中点 (z₁+z₂)/2</text>
<circle cx="538.1" cy="119.1" r="4.5" fill="#2f855a" stroke="#2f855a" stroke-width="1"/>
<circle cx="522.8" cy="241.9" r="4.5" fill="#c05621" stroke="#c05621" stroke-width="1"/>
