<circle cx="354.0" cy="211.2" r="3.6" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/>
<text x="362.0" y="229.2" font-size="11" fill="#666" text-anchor="start">t = ½</text>
<circle cx="430.7" cy="172.8" r="3.6" fill="#2b6cb0" stroke="#2b6cb0" stroke-width="1"/>
<text x="438.7" y="190.8" font-size="11" fill="#666" text-anchor="start">t = 1</text>
<circle cx="507.4" cy="134.4" r="3.6" fill="#333" stroke="#333" stroke-width="1"/>
<text x="515.4" y="152.4" font-size="11" fill="#666" text-anchor="start">t = 3/2</text>
<circle cx="584.2" cy="96.0" r="3.6" fill="#333" stroke="#333" stroke-width="1"/>
<text x="592.2" y="114.0" font-size="11" fill="#666" text-anchor="start">t = 2</text>
