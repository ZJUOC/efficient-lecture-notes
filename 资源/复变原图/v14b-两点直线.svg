<text x="534.3" y="245.7" font-size="14" fill="#c05621" text-anchor="start" font-style="italic">z₄</text>
<text x="453.7" y="284.1" font-size="12" fill="#2f855a" text-anchor="start">(z₃ − z₁)/(z₂ − z₁) = 1.7，实数 ⇒ 在直线上</text>
<text x="453.7" y="302.1" font-size="12" fill="#c05621" text-anchor="start">(z₄ − z₁)/(z₂ − z₁) = 1.3 − 0.6i，不是实数 ⇒ 不在</text>
<text x="231.2" y="73.0" font-size="12" fill="#333" text-anchor="start">z = z₁ + t(z₂ − z₁)：t 走遍实数是直线，</text>
<text x="231.2" y="90.0" font-size="12" fill="#333" text-anchor="start">0 ≤ t ≤ 1 是蓝色线段</text>
<text x="400.0" y="26.0" font-size="15" fill="#333" text-anchor="middle">从 z₁ 出发，沿方向 z₂ − z₁ 走 t 倍</text>
