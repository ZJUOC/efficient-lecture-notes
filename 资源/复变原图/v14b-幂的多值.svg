<text x="430.0" y="90.0" font-size="12" fill="#666" text-anchor="start">深蓝：k = 0, ±1, 2；浅蓝：|k| ≤ 40 的其余值</text>
<text x="430.0" y="116.0" font-size="13" fill="#333" text-anchor="start">每加 1，辐角转 2√2π ≈ 1.41 圈：</text>
<text x="430.0" y="136.0" font-size="13" fill="#333" text-anchor="start">√2 是无理数，永远转不回起点，</text>
<text x="430.0" y="156.0" font-size="13" fill="#333" text-anchor="start">点越来越密地铺满整个圆周。</text>
<text x="430.0" y="200.0" font-size="14" fill="#6b46c1" text-anchor="start">i^i = e^(−(π/2 + 2kπ))：全是正实数</text>
<text x="430.0" y="224.0" font-size="13" fill="#6b46c1" text-anchor="start">k = −1：111.3</text>
<text x="430.0" y="244.0" font-size="13" fill="#6b46c1" text-anchor="start" font-weight="bold">k = 0（主值）：0.2079</text>
<text x="430.0" y="264.0" font-size="13" fill="#6b46c1" text-anchor="start">k = 1：0.000388</text>
<text x="430.0" y="290.0" font-size="12" fill="#666" text-anchor="start">相邻两个值相差 e^(2π) ≈ 535 倍</text>
<text x="400.0" y="375.0" font-size="12" fill="#666" text-anchor="middle">幂 a^b = e^(b·Ln a) 的多值性全部来自 Ln a 的 2kπi</text>
