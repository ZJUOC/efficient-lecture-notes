<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" font-family="'Noto Serif SC', 'Songti SC', Helvetica, Arial, sans-serif">
<rect width="580" height="320" fill="#ffffff"/>
<defs>
  <marker id="arr-dark" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,1 L9,5 L0,9 z" fill="#334155"/>
  </marker>
  <marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,1 L9,5 L0,9 z" fill="#1d4ed8"/>
  </marker>
  <marker id="arr-red" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,1 L9,5 L0,9 z" fill="#b91c1c"/>
  </marker>
  <marker id="arr-amber" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,1 L9,5 L0,9 z" fill="#b45309"/>
  </marker>
</defs>

  <line x1="65" y1="275.0" x2="545" y2="275.0" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-dark)"/>
  <line x1="95" y1="298" x2="95" y2="30" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-dark)"/>
  <text x="550" y="280.0" font-size="14" fill="#334155" font-style="italic">ξ</text>
  <text x="103" y="42" font-size="14" fill="#334155" font-style="italic">τ</text>
  <text x="80" y="294" font-size="13" fill="#475569" font-style="italic">O</text>

  <polygon points="155.0,275.0 330.0,72.0 505.0,275.0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="330" y="242" font-size="16" fill="#1e3a8a" text-anchor="middle" font-style="italic" font-weight="bold">G(x, t)</text>

  <line x1="95" y1="185.0" x2="232.6" y2="185.0" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="232.6" y1="185.0" x2="427.4" y2="185.0" stroke="#b91c1c" stroke-width="2.6"/>
  <text x="84" y="189.0" font-size="13" fill="#b91c1c" text-anchor="end" font-style="italic">τ</text>

  <line x1="95" y1="72.0" x2="330.0" y2="72.0" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="3 3"/>
  <circle cx="330.0" cy="72.0" r="4.2" fill="#b91c1c"/>
  <text x="84" y="76.0" font-size="13" fill="#334155" text-anchor="end" font-style="italic">t</text>
  <text x="330.0" y="58.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">(x, t)</text>

  <text x="218" y="138" font-size="13" fill="#1d4ed8" text-anchor="end">ξ = x − a(t − τ)</text>
  <text x="442" y="138" font-size="13" fill="#1d4ed8" text-anchor="start">ξ = x + a(t − τ)</text>

  <text x="330" y="206" font-size="12" fill="#991b1b" text-anchor="middle">dξ 积分区间 [x−a(t−τ), x+a(t−τ)]</text>

  <text x="155.0" y="295" font-size="13" fill="#334155" text-anchor="middle">x − at</text>
  <text x="505.0" y="295" font-size="13" fill="#334155" text-anchor="middle">x + at</text>

</svg>
