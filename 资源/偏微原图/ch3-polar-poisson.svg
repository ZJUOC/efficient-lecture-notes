<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="620" height="340" font-family="system-ui,-apple-system,'PingFang SC','Noto Serif SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="620" height="340" fill="#fff"/>
  <circle cx="166" cy="178" r="112" fill="#f4f8fc" stroke="#1d5b9b" stroke-width="2.2"/>
  <!-- Axes -->
  <line x1="30" y1="178" x2="308" y2="178" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="166" y1="312" x2="166" y2="38" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="312" y="182" font-size="13" fill="#333" font-style="italic">x</text>
  <text x="161" y="32" font-size="13" fill="#333" font-style="italic">y</text>
  <text x="151" y="194" font-size="13" fill="#333" font-style="italic">O</text>

  <!-- Radii OP, OQ and chord PQ -->
  <line x1="166" y1="178" x2="222.4" y2="150.5" stroke="#1d5b9b" stroke-width="1.8"/>
  <line x1="166" y1="178" x2="196.9" y2="70.3" stroke="#2f7d4d" stroke-width="1.8"/>
  <line x1="222.4" y1="150.5" x2="196.9" y2="70.3" stroke="#c23b2b" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Angle arcs -->
  <path d="M 208.0 178.0 A 42 42 0 0 0 203.7 159.6" fill="none" stroke="#1d5b9b" stroke-width="1.4"/>
  <path d="M 191.0 178.0 A 25 25 0 0 0 172.9 154.0" fill="none" stroke="#2f7d4d" stroke-width="1.4"/>
  <path d="M 212.7 155.2 A 52 52 0 0 0 180.3 128.0" fill="none" stroke="#c23b2b" stroke-width="1.6"/>

  <!-- Points -->
  <circle cx="222.4" cy="150.5" r="4.2" fill="#1d5b9b"/>
  <circle cx="196.9" cy="70.3" r="4.5" fill="#2f7d4d"/>
  <circle cx="166" cy="178" r="3" fill="#333"/>

  <!-- Labels on geometry -->
  <text x="212" y="171" font-size="12" fill="#1d5b9b" font-style="italic">θ</text>
  <text x="179" y="149" font-size="12" fill="#2f7d4d" font-style="italic">τ</text>
  <text x="199.7" y="129.9" font-size="11.5" fill="#c23b2b" font-style="italic">τ−θ</text>
  <text x="196.2" y="180.3" font-size="13" fill="#1d5b9b" font-style="italic">r</text>
  <text x="167.4" y="119.2" font-size="13" fill="#2f7d4d" font-style="italic">a</text>
  <text x="217.6" y="107.4" font-size="13" fill="#c23b2b" font-style="italic">d</text>

  <text x="229.4" y="155.5" font-size="12.5" fill="#1d5b9b" font-weight="600">P(r, θ)</text>
  <text x="203.9" y="63.3" font-size="12.5" fill="#2f7d4d" font-weight="600">Q(a, τ)</text>
  <text x="16" y="64" font-size="12.5" fill="#1d5b9b">r = a: u = φ(τ)</text>

  <!-- Right side formula box -->
  <rect x="336" y="42" width="268" height="254" rx="8" fill="#fafafa" stroke="#d5dde5" stroke-width="1.2"/>
  <text x="352" y="72" font-size="14" font-weight="700" fill="#1d3557">圆域 Poisson 核的几何意义</text>
  <text x="352" y="104" font-size="12.5" fill="#333">由 △OPQ 余弦定理：</text>
  <text x="356" y="130" font-size="12.5" fill="#c23b2b" font-weight="600">d<tspan dy="-4.5" font-size="9.0">2</tspan><tspan dy="4.5"> = a</tspan><tspan dy="-4.5" font-size="9.0">2</tspan><tspan dy="4.5"> − 2ar cos(θ − τ) + r</tspan><tspan dy="-4.5" font-size="9.0">2</tspan><tspan dy="4.5">&#8203;</tspan></text>
  <text x="352" y="166" font-size="12.5" fill="#333">圆内 Dirichlet 问题解：</text>
  <text x="354" y="192" font-size="12" fill="#1d5b9b" font-weight="600">u(r, θ) = (1/2π) ∫₀<tspan dy="-4.3" font-size="8.6">2π</tspan><tspan dy="4.3"> K(r, θ−τ) φ(τ) dτ</tspan></text>
  <text x="356" y="222" font-size="12.5" fill="#2f7d4d" font-weight="600">K = (a<tspan dy="-4.5" font-size="9.0">2</tspan><tspan dy="4.5"> − r</tspan><tspan dy="-4.5" font-size="9.0">2</tspan><tspan dy="4.5">) / d</tspan><tspan dy="-4.5" font-size="9.0">2</tspan><tspan dy="4.5">&#8203;</tspan></text>
  <text x="352" y="256" font-size="11.5" fill="#555">• P→Q 时 d→0，核函数高度集中</text>
  <text x="352" y="276" font-size="11.5" fill="#555">• r=0 时 K≡1，退化为均值公式</text>
</svg>