<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 315" font-family="'Noto Serif SC', 'Songti SC', Helvetica, Arial, sans-serif">
<rect width="780" height="315" fill="#ffffff"/>
<defs>
  <marker id="arr-dark" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,1 L9,5 L0,9 z" fill="#334155"/>
  </marker>
  <marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,1 L9,5 L0,9 z" fill="#1d4ed8"/>
  </marker>
  <marker id="arr-red" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,1 L9,5 L0,9 z" fill="#b91c1c"/>
  </marker>
  <marker id="arr-amber" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,1 L9,5 L0,9 z" fill="#b45309"/>
  </marker>
</defs>

  <text x="220" y="28" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">半无界弦区域划分与反射特征线</text>
  <polygon points="180.0,265.0 180.0,55 390.0,55" fill="#fef2f2"/>
  <polygon points="180.0,265.0 390.0,55 410.0,265.0" fill="#eff6ff"/>

  <line x1="45" y1="265.0" x2="418" y2="265.0" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="180.0" y1="285" x2="180.0" y2="48" stroke="#1e293b" stroke-width="2.4" marker-end="url(#arr-dark)"/>
  <text x="424" y="269.0" font-size="13" fill="#334155" font-style="italic">x</text>
  <text x="188.0" y="52" font-size="13" fill="#1e293b" font-style="italic">t</text>

  <line x1="180.0" y1="265.0" x2="385.0" y2="60.0" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="352.0" y="68" font-size="12" fill="#92400e" text-anchor="end">x = at</text>

  <line x1="100.0" y1="265.0" x2="180.0" y2="185.0" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3"/>
  <polyline points="260.0,265.0 180.0,185.0 245.0,120.0" fill="none" stroke="#b91c1c" stroke-width="2.2"/>
  <line x1="390.0" y1="265.0" x2="245.0" y2="120.0" stroke="#1d4ed8" stroke-width="2.2"/>

  <circle cx="245.0" cy="120.0" r="4.2" fill="#1e293b"/>
  <circle cx="180.0" cy="185.0" r="3.5" fill="#b91c1c"/>
  <text x="253.0" y="116.0" font-size="13" fill="#1e293b" font-weight="bold">P(x,t)</text>
  <text x="172.0" y="189.0" font-size="11.5" fill="#b91c1c" text-anchor="end">反射 (0, t−x/a)</text>

  <text x="100.0" y="284" font-size="11.5" fill="#64748b" text-anchor="middle">x−at &lt; 0</text>
  <text x="260.0" y="284" font-size="11.5" fill="#b91c1c" text-anchor="middle">at−x</text>
  <text x="390.0" y="284" font-size="11.5" fill="#1d4ed8" text-anchor="middle">x+at</text>
  <text x="187.0" y="284" font-size="11.5" fill="#334155" text-anchor="start">0</text>

  <text x="236" y="76" font-size="12.5" fill="#991b1b" text-anchor="middle" font-weight="bold">区域 II (x &lt; at)</text>
  <text x="355" y="170" font-size="12.5" fill="#1e40af" text-anchor="middle" font-weight="bold">区域 I (x &gt; at)</text>
  <text x="92" y="218" font-size="11.5" fill="#64748b" text-anchor="middle">虚延拓侧 x &lt; 0</text>

  <text x="605" y="28" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">对称延拓：奇延拓与偶延拓</text>
  <line x1="468" y1="200.0" x2="742" y2="200.0" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="605.0" y1="295" x2="605.0" y2="75" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="746" y="204.0" font-size="13" fill="#334155" font-style="italic">x</text>
  <text x="613.0" y="82" font-size="13" fill="#334155" font-style="italic">Φ(x)</text>

  <polyline points="630.0,200.0 670.0,135.0 710.0,200.0" fill="none" stroke="#1e293b" stroke-width="2.6"/>
  <polyline points="500.0,200.0 540.0,135.0 580.0,200.0" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="6 3"/>
  <polyline points="500.0,200.0 540.0,265.0 580.0,200.0" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="6 3"/>

  <text x="670.0" y="127.0" font-size="12" fill="#1e293b" text-anchor="middle">原初值 φ(x)</text>
  <text x="527.0" y="125.0" font-size="11.5" fill="#1d4ed8" text-anchor="middle">偶延拓 +φ(−x)</text>
  <text x="527.0" y="109.0" font-size="11" fill="#1d4ed8" text-anchor="middle">自由端 u<tspan dy="3" font-size="72%">x</tspan>(0,t)=0</text>
  <text x="527.0" y="282.0" font-size="11.5" fill="#b91c1c" text-anchor="middle">奇延拓 −φ(−x)</text>
  <text x="527.0" y="298.0" font-size="11" fill="#b91c1c" text-anchor="middle">固定端 u(0,t)=0</text>

</svg>
