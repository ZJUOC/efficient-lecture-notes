<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 365" width="680" height="365" font-family="system-ui,-apple-system,'PingFang SC','Noto Serif SC',sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="680" height="365" fill="#fff"/>
  <line x1="336" y1="22" x2="336" y2="345" stroke="#e2e6ea" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- LEFT: Cylindrical (r, theta, z) -->
  <text x="92" y="34" font-size="14" font-weight="700" fill="#1d3557">柱坐标 (r, θ, z)</text>
  <line x1="148" y1="212" x2="148" y2="67" stroke="#444" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="148" y1="212" x2="62" y2="272" stroke="#444" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="148" y1="212" x2="280" y2="212" stroke="#444" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="136" y="69" font-size="13" fill="#333" font-style="italic">z</text>
  <text x="48" y="282" font-size="13" fill="#333" font-style="italic">x</text>
  <text x="285" y="216" font-size="13" fill="#333" font-style="italic">y</text>
  <text x="132" y="208" font-size="12" fill="#555" font-style="italic">O</text>

  <line x1="148" y1="212" x2="200" y2="246" stroke="#1d5b9b" stroke-width="2"/>
  <line x1="200" y1="246" x2="200" y2="136" stroke="#2f7d4d" stroke-width="2"/>
  <line x1="148" y1="102" x2="200" y2="136" stroke="#999" stroke-width="1.1" stroke-dasharray="4,3"/>
  <circle cx="200" cy="136" r="4.2" fill="#c23b2b"/>
  <circle cx="200" cy="246" r="3" fill="#1d5b9b"/>
  <path d="M 122 230 A 34 22 0 0 0 176 230" fill="none" stroke="#c23b2b" stroke-width="1.5"/>
  <text x="146" y="245" font-size="13" fill="#c23b2b" font-style="italic">θ</text>
  <text x="176" y="225" font-size="13" fill="#1d5b9b" font-style="italic">r</text>
  <text x="207" y="194" font-size="13" fill="#2f7d4d" font-style="italic">z</text>
  <text x="206" y="132" font-size="13" fill="#c23b2b" font-weight="600">P(r, θ, z)</text>

  <text x="34" y="318" font-size="12" fill="#333">x = r cosθ,  y = r sinθ,  r ≥ 0</text>
  <text x="34" y="340" font-size="11.5" fill="#1d5b9b">θ ∈ [0, 2π) 周期；r → 0 有界性自然边界</text>

  <!-- RIGHT: Spherical (rho, varphi, theta) -->
  <text x="424" y="34" font-size="14" font-weight="700" fill="#1d3557">球坐标 (ρ, φ, θ)</text>
  <line x1="482" y1="212" x2="482" y2="67" stroke="#444" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="482" y1="212" x2="396" y2="272" stroke="#444" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="482" y1="212" x2="614" y2="212" stroke="#444" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="470" y="69" font-size="13" fill="#333" font-style="italic">z</text>
  <text x="382" y="282" font-size="13" fill="#333" font-style="italic">x</text>
  <text x="619" y="216" font-size="13" fill="#333" font-style="italic">y</text>
  <text x="466" y="208" font-size="12" fill="#555" font-style="italic">O</text>

  <line x1="482" y1="212" x2="538" y2="128" stroke="#c23b2b" stroke-width="2.1"/>
  <line x1="482" y1="212" x2="538" y2="248" stroke="#999" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="538" y1="248" x2="538" y2="128" stroke="#999" stroke-width="1.3" stroke-dasharray="4,3"/>
  <circle cx="538" cy="128" r="4.2" fill="#c23b2b"/>
  <path d="M 482 170 A 42 42 0 0 1 505 177" fill="none" stroke="#2f7d4d" stroke-width="1.6"/>
  <path d="M 456 230 A 34 22 0 0 0 510 230" fill="none" stroke="#1d5b9b" stroke-width="1.5"/>

  <text x="490" y="164" font-size="13" fill="#2f7d4d" font-weight="600" font-style="italic">φ</text>
  <text x="480" y="245" font-size="13" fill="#1d5b9b" font-style="italic">θ</text>
  <text x="516" y="176" font-size="13" fill="#c23b2b" font-style="italic">ρ</text>
  <text x="544" y="124" font-size="13" fill="#c23b2b" font-weight="600">P(ρ, φ, θ)</text>

  <text x="358" y="318" font-size="11.5" fill="#333">x = ρ sinφ cosθ,  y = ρ sinφ sinθ,  z = ρ cosφ</text>
  <text x="358" y="340" font-size="11.5" fill="#2f7d4d">φ ∈ [0, π] 极角（x=cosφ∈[−1,1]），θ ∈ [0, 2π) 方位角</text>
</svg>