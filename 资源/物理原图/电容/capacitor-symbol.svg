<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Helvetica, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <!-- two conductors -->
  <rect x="190" y="50" width="12" height="130" fill="#666"/>
  <rect x="290" y="50" width="12" height="130" fill="#666"/>
  <!-- leads -->
  <line x1="196" y1="115" x2="110" y2="115" stroke="#333" stroke-width="2"/>
  <line x1="296" y1="115" x2="450" y2="115" stroke="#333" stroke-width="2"/>
  <text x="196" y="40" font-size="16" fill="#c53030" font-weight="bold" text-anchor="middle">+Q</text>
  <text x="296" y="40" font-size="16" fill="#2b6cb0" font-weight="bold" text-anchor="middle">−Q</text>
  <!-- voltage between conductors -->
  <line x1="196" y1="195" x2="296" y2="195" stroke="#333" stroke-width="1.2" marker-start="url(#a5)" marker-end="url(#a5)"/>
  <text x="246" y="215" font-size="15" fill="#333" text-anchor="middle">U_ab = φ_a − φ_b</text>
  <defs>
    <marker id="a5" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
  </defs>
  <text x="380" y="90" font-size="15" fill="#333" text-anchor="middle">C = Q / U_ab</text>
  <text x="380" y="150" font-size="13" fill="#666" text-anchor="middle">两导体靠近放置，互不接触</text>
  <text x="380" y="172" font-size="13" fill="#666" text-anchor="middle">孤立导体：另一极位于无穷远</text>
</svg>
