<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Helvetica, Arial, sans-serif">
  <rect width="520" height="320" fill="#ffffff"/>
  <!-- axes -->
  <line x1="70" y1="260" x2="470" y2="260" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="260" x2="70" y2="40" stroke="#333" stroke-width="1.5"/>
  <text x="470" y="284" font-size="15" fill="#333" text-anchor="end">U</text>
  <text x="48" y="45" font-size="15" fill="#333" text-anchor="end">q</text>
  <!-- filled area under the line (energy) -->
  <polygon points="70,260 350,260 350,110 70,260" fill="#bee3f8" stroke="none"/>
  <!-- q = C u line -->
  <line x1="70" y1="260" x2="400" y2="92" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="410" y="88" font-size="15" fill="#2b6cb0">q = C u</text>
  <!-- labels at endpoint -->
  <line x1="350" y1="260" x2="350" y2="110" stroke="#333" stroke-dasharray="5 4"/>
  <line x1="70" y1="110" x2="350" y2="110" stroke="#333" stroke-dasharray="5 4"/>
  <text x="350" y="278" font-size="14" fill="#333" text-anchor="middle">U</text>
  <text x="60" y="114" font-size="14" fill="#333" text-anchor="end">Q</text>
  <text x="210" y="200" font-size="15" fill="#1a365d" text-anchor="middle">W = ½QU</text>
  <text x="260" y="304" font-size="13" fill="#666" text-anchor="middle">三角形面积即外力做的功（电荷从 0 逐步增加到 Q）</text>
</svg>
