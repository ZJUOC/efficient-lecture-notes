<text x="306.1" y="185.9" font-size="13" fill="#2b6cb0" text-anchor="start">1 + i</text>
<text x="215.5" y="86.2" font-size="13" fill="#2b6cb0" text-anchor="start">2i</text>
<text x="235.4" y="208.6" font-size="12" fill="#c05621" text-anchor="start">π/4</text>
<text x="65.9" y="294.6" font-size="12" fill="#c53030" text-anchor="start">割线</text>
<text x="460.0" y="96.0" font-size="13" fill="#333" text-anchor="start">线段在上半平面，不碰割线 ⇒ 主值 ln z 可用</text>
<text x="460.0" y="132.0" font-size="13" fill="#333" text-anchor="start">∫ dz/z = ln(2i) − ln(1 + i)</text>
<text x="460.0" y="158.0" font-size="13" fill="#333" text-anchor="start">实部：ln|2i| − ln|1 + i| = ln 2 − ½ln 2 = ½ln 2</text>
<text x="460.0" y="180.0" font-size="12" fill="#666" text-anchor="start">（终点、起点到原点的距离之比取对数）</text>
<text x="460.0" y="214.0" font-size="13" fill="#c05621" text-anchor="start">虚部：π/2 − π/4 = π/4</text>
<text x="460.0" y="236.0" font-size="12" fill="#666" text-anchor="start">（沿途辐角转过的角度，图中橙色弧）</text>
<text x="460.0" y="276.0" font-size="14" fill="#2b6cb0" text-anchor="start" font-weight="bold">结果 ½ln 2 + iπ/4</text>
<text x="400.0" y="26.0" font-size="15" fill="#333" text-anchor="middle">∫ dz/z = Δ ln|z| + i·Δarg z</text>
