<text x="265.8" y="241.7" font-size="13" fill="#c53030" text-anchor="start">−i</text>
<text x="333.3" y="90.5" font-size="12" fill="#2b6cb0" text-anchor="start">|z| = 2</text>
<text x="520.0" y="96.0" font-size="13" fill="#666" text-anchor="start">奇点 ±3 在圆外（灰）</text>
<text x="520.0" y="116.0" font-size="13" fill="#c53030" text-anchor="start">奇点 −i 在圆内（红）</text>
<text x="520.0" y="152.0" font-size="13" fill="#333" text-anchor="start">f(z) = z/(9 − z²)</text>
<text x="520.0" y="172.0" font-size="13" fill="#333" text-anchor="start">在 |z| ≤ 2 上解析</text>
<text x="520.0" y="208.0" font-size="13" fill="#2b6cb0" text-anchor="start">∮ f(z)/(z + i) dz = 2πi·f(−i)</text>
<text x="520.0" y="230.0" font-size="13" fill="#2b6cb0" text-anchor="start" font-weight="bold">= 2πi·(−i/10) = π/5</text>
<text x="400.0" y="26.0" font-size="15" fill="#333" text-anchor="middle">圈外的奇点留在 f 里；圈内的那一个，放进分母 z − z₀</text>
