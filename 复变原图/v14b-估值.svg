<text x="84.4" y="224.4" font-size="12" fill="#2f855a" text-anchor="end">−1</text>
<text x="356.9" y="188.9" font-size="12" fill="#c05621" text-anchor="start">3</text>
<text x="113.1" y="149.3" font-size="12" fill="#2f855a" text-anchor="end">|z + 1|</text>
<text x="195.1" y="149.3" font-size="12" fill="#666" text-anchor="start">2</text>
<text x="155.4" y="217.9" font-size="12" fill="#666" text-anchor="middle">2</text>
<text x="316.9" y="85.5" font-size="12" fill="#2b6cb0" text-anchor="start">C: |z − 1| = 2</text>
<text x="450.0" y="90.0" font-size="13" fill="#333" text-anchor="start">三角形两边之和 ≥ 第三边：</text>
<text x="450.0" y="110.0" font-size="13" fill="#2f855a" text-anchor="start">|z + 1| ≤ |z − 1| + 2 = 4</text>
<text x="450.0" y="130.0" font-size="12" fill="#666" text-anchor="start">在 z = 3 取到 4，在 z = −1 为 0</text>
<text x="450.0" y="170.0" font-size="13" fill="#333" text-anchor="start">分母 |z − 1| 在 C 上恒为 2</text>
<text x="450.0" y="190.0" font-size="13" fill="#333" text-anchor="start">C 的长度 = 2π·2 = 4π</text>
<text x="450.0" y="220.0" font-size="14" fill="#2b6cb0" text-anchor="start" font-weight="bold">估值：(4/2)·4π = 8π</text>
<text x="450.0" y="250.0" font-size="13" fill="#333" text-anchor="start">实际值：(z+1)/(z−1) = 1 + 2/(z−1)</text>
<text x="450.0" y="270.0" font-size="13" fill="#333" text-anchor="start">积分 = 0 + 2·2πi = 4πi，模 4π ≤ 8π</text>
<text x="450.0" y="296.0" font-size="12" fill="#666" text-anchor="start">估值只给上界，不必等于真实值</text>
<text x="400.0" y="26.0" font-size="15" fill="#333" text-anchor="middle">估值不等式：|∮ f dz| ≤（f 在 C 上模的最大值）×（C 的长度）</text>
