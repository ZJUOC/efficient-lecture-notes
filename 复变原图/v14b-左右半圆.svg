<text x="195.3" y="357.3" font-size="12" fill="#333" text-anchor="start">起点 −3i</text>
<text x="195.3" y="78.9" font-size="12" fill="#333" text-anchor="start">终点 3i</text>
<text x="314.9" y="194.4" font-size="12" fill="#2b6cb0" text-anchor="start">右半圆</text>
<text x="55.1" y="194.4" font-size="12" fill="#c53030" text-anchor="end">左半圆</text>
<text x="195.3" y="233.6" font-size="11" fill="#666" text-anchor="start">0：两个被积函数的奇点</text>
<text x="380.0" y="108.0" font-size="13" fill="#333" text-anchor="start" font-weight="bold"></text>
<text x="560.0" y="108.0" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="bold">右半圆</text>
<text x="660.0" y="108.0" font-size="13" fill="#c53030" text-anchor="middle" font-weight="bold">左半圆</text>
<text x="760.0" y="108.0" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">差</text>
