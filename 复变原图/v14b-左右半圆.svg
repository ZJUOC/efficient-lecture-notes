<text x="380.0" y="140.0" font-size="13" fill="#333" text-anchor="start">∫ dz/z²</text>
<text x="560.0" y="140.0" font-size="13" fill="#2b6cb0" text-anchor="middle">2i/3</text>
<text x="660.0" y="140.0" font-size="13" fill="#c53030" text-anchor="middle">2i/3</text>
<text x="760.0" y="140.0" font-size="13" fill="#2f855a" text-anchor="middle" font-weight="bold">0</text>
<text x="380.0" y="166.0" font-size="13" fill="#333" text-anchor="start">∫ dz/z</text>
<text x="560.0" y="166.0" font-size="13" fill="#2b6cb0" text-anchor="middle">πi</text>
<text x="660.0" y="166.0" font-size="13" fill="#c53030" text-anchor="middle">−πi</text>
<text x="760.0" y="166.0" font-size="13" fill="#c05621" text-anchor="middle" font-weight="bold">2πi</text>
<text x="380.0" y="200.0" font-size="13" fill="#333" text-anchor="start">右半圆 − 左半圆 = 逆时针整圆 |z| = 3：</text>
<text x="380.0" y="220.0" font-size="13" fill="#333" text-anchor="start">差就是 ∮dz/zⁿ，n = 2 时为 0，n = 1 时为 2πi</text>
<text x="380.0" y="256.0" font-size="13" fill="#2f855a" text-anchor="start">1/z²：原函数 −1/z 单值，只看端点 → 路径无关</text>
<text x="380.0" y="280.0" font-size="13" fill="#c05621" text-anchor="start">1/z：原函数 ln z 绕原点一圈多 2πi → 路径有关</text>
<text x="380.0" y="316.0" font-size="12" fill="#666" text-anchor="start">右半圆不碰负实轴，ln z 主值可用：</text>
<text x="380.0" y="334.0" font-size="12" fill="#666" text-anchor="start">ln 3i − ln(−3i) = iπ/2 − (−iπ/2) = πi</text>
<text x="410.0" y="26.0" font-size="15" fill="#333" text-anchor="middle">同样从 −3i 到 3i，两条半圆分走奇点 0 的两侧</text>
</svg>
